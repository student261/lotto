[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/javascript"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

# ==============================================================================
# API REVERSE PROXY TO ENZONIC PRODUCTION BACKEND
# Must appear BEFORE the SPA frontend fallback rule.
# ==============================================================================
[[redirects]]
  from = "/api/*"
  to = "https://jackpotlo-api.enzonic.dev/api/:splat"
  status = 200
  force = true

# ==============================================================================
# POS APP (/app, /admin) - must appear BEFORE the site fallback
# ==============================================================================
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/app/index.html"
  status = 200

# ==============================================================================
# SPA FRONTEND ROUTING FALLBACK
# ==============================================================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
