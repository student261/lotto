[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/javascript"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

# ==============================================================================
# API REVERSE PROXY TO RAILWAY BACKEND
# Must appear BEFORE the SPA frontend fallback rule.
# Replace the target URL with your deployed Railway service domain, for example:
# to = "https://jackpotlo-production.up.railway.app/api/:splat"
# ==============================================================================
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-RAILWAY-BACKEND.up.railway.app/api/:splat"
  status = 200
  force = true

# ==============================================================================
# SPA FRONTEND ROUTING FALLBACK
# ==============================================================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
